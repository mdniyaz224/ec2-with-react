name: Deploy to EC2

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          test -n "$EC2_HOST" && test -n "$EC2_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/ec2_key ec2-user@"$EC2_HOST" "sudo dnf install -y nginx rsync && sudo systemctl enable --now nginx && sudo chown -R ec2-user:ec2-user /usr/share/nginx/html"
          rsync -avz --delete -e "ssh -i ~/.ssh/ec2_key" dist/ "ec2-user@$EC2_HOST:/usr/share/nginx/html/"
