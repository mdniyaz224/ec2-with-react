name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Deploy
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_PATH: ${{ vars.EC2_DEPLOY_PATH }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          test -n "$EC2_HOST" && test -n "$EC2_USER" && test -n "$EC2_PATH" && test -n "$EC2_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete -e "ssh -i ~/.ssh/ec2_key" dist/ "$EC2_USER@$EC2_HOST:$EC2_PATH/"
